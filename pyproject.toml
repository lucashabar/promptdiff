[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lucashabar-promptdiff"
version = "0.1.0"
description = "按语义块比对两版提示词，区分措辞调整、约束增删与结构变动。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lucashabar" }]
keywords = ["prompt", "diff", "review", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lucashabar.github.io"
Repository = "https://github.com/lucashabar/promptdiff"
Issues = "https://github.com/lucashabar/promptdiff/issues"

[project.scripts]
promptdiff = "promptdiff:main"

[tool.setuptools]
py-modules = ["promptdiff"]
